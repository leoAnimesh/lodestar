name: Pages

# Publishes the static landing page in site/ to GitHub Pages. No build step:
# the folder is uploaded as is. Pages must be set to "Source: GitHub Actions"
# in the repository settings. Custom domain: see docs/CUSTOM-DOMAIN.md.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stamp sitemap lastmod
        run: sed -i "s|<lastmod>[^<]*</lastmod>|<lastmod>$(date -u +%F)</lastmod>|" site/sitemap.xml
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
